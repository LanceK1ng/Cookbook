function parseImport(txt){
  var out=[];
  txt.split(/\n\s*-{3,}\s*(?:\n|$)/).forEach(function(b){
    var ls=b.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(!ls.length)return;
    var r={name:ls.shift().replace(/^(#+\s*|name\s*:\s*)/i,'').trim(),ing:[],steps:[],src:'',notes:''},sec='',I=[],T=[],N=[];
    ls.forEach(function(l){
      var h=l.toLowerCase().replace(/[:\uFF1A]\s*$/,'');
      if(h==='ingredients'){sec='i';return}
      if(/^(steps|preparation|directions|method|instructions)$/.test(h)){sec='s';return}
      if(h==='notes'){sec='n';return}
      var sm=l.match(/^(serves|servings)\s*:\s*(\d+)/i);if(sm){r.serves=+sm[2];return}
      var m=l.match(/^(source|link|url)\s*:\s*(\S+)/i);
      if(m){if(/^https?:\/\//i.test(m[2]))r.src=m[2];return}
      if(sec==='i')I.push(l);else if(sec==='s')T.push(l);else if(sec==='n')N.push(l);
    });
    r.ing=lines(I.join('\n')).map(parseLine).filter(function(i){return i.n});r.steps=lines(T.join('\n'),true);r.notes=N.join('\n');
    if(r.name)out.push(r);
  });
  return out;
}

  else if(a==='cleardone'){S.list=S.list.filter(function(i){return!S.done[gk(i)]});S.done={};save()}
  else if(a==='clearall'){S.list=[];S.done={};save()}
  render();
  if(a==='addi'&&$('#ni'))$('#ni').focus();
});
document.addEventListener('change',function(e){var t=e.target;if(!t.classList||!t.classList.contains('mc')||!t.isConnected||t.dataset.busy)return;t.dataset.busy='1';var i=+t.dataset.i,old=S.cats[i],nn=t.value.trim();
  if(old===undefined||!nn||nn===old){t.value=old||'';delete t.dataset.busy;return}
  var j=S.cats.findIndex(function(c,k){return k!==i&&c.toLowerCase()===nn.toLowerCase()});
  if(j>=0){var tg=S.cats[j];swapCat(old,tg);S.cats.splice(i,1);save();$('#cats').innerHTML=catsHtml();toast('Merged into '+tg)}else{swapCat(old,nn);S.cats[i]=nn;save();delete t.dataset.busy}});
document.addEventListener('change',function(e){var t=e.target;if(t.classList&&t.classList.contains('iu'))t.classList.toggle('blank',!t.value)});
document.addEventListener('change',function(e){if(e.target.id!=='bk'||!e.target.files[0])return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||o.app!=='weekly-meals'||!o.data||!Array.isArray(o.data.recipes))throw 0;imp=o.data;impAdd=o.mode==='add';var f=$('#foot');if(f)f.innerHTML=footHtml()}catch(x){toast('That doesn’t look like a cookbook backup')}};fr.readAsText(e.target.files[0]);e.target.value=''});
render();
if(seedMsg)toast(seedMsg);
initDb();
idbOpen().then(function(d){IDB=d;if(!d)return;return idbAll().then(function(ph){PH_OK=true;S.recipes.forEach(function(r){if(!r.img&&ph[r.id])r.img=ph[r.id];photoSaved[r.id]=ph[r.id]||''});save();if(tab!=='add'&&pick===null)render()})});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
